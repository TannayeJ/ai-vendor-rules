name: Validate rules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated rules against current upstream
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git "$RUNNER_TEMP/domain-list-community"
          python3 scripts/generate.py --source-root "$RUNNER_TEMP/domain-list-community/data" --check
          python3 scripts/validate.py

